<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MRO 业务管理</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo">M</div>
      <div>
        <h1>MRO 业务管理</h1>
        <p>6 人团队协作版</p>
      </div>
    </div>
    <nav id="nav"></nav>
    <div class="side-foot">
      <button class="link-btn" id="btnExport">导出数据</button>
      <button class="link-btn" id="btnImport">导入数据</button>
      <button class="link-btn" id="btnReset">恢复示例</button>
      <input type="file" id="fileInput" accept=".json" hidden />
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div class="search">
        <span style="color:#a7b0c0">🔍</span>
        <input id="globalSearch" placeholder="搜索客户、供应商、物料、报价单号…" />
      </div>
      <div style="flex:1"></div>
      <button class="btn btn-primary" id="btnNewTop">+ 新建</button>
    </div>
    <div class="content" id="content"></div>
  </main>
</div>

<div class="mask" id="mask">
  <div class="modal">
    <div class="modal-head">
      <h3 id="modalTitle">新建记录</h3>
      <button class="op" id="modalClose" style="font-size:18px">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot">
      <button class="btn btn-ghost" id="modalCancel">取消</button>
      <button class="btn btn-primary" id="modalSave">保存</button>
    </div>
  </div>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
